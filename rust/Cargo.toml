[package]
name = "vodozemac-java"
version = "1.0.0"
authors = ["François Herbreteau <francois.herbreteau@gmail.com>"]
edition = "2024"

[lib]
name = "vodozemac_java"
crate-type = ["cdylib", "rlib"]

[dependencies]
vodozemac = {version = "0.9.0", features = [ "libolm-compat" ]}
jni = "0.22.4"
serde_json = "1.0.141"

[dev-dependencies]
jni = { version = "0.22.4", features = ["invocation"] }
