name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0 or 1.0.0-rc1)'
        required: true
        type: string

concurrency:
  group: prepare-release
  cancel-in-progress: false

env:
  JAVA_VERSION: "25"

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Check that the triggering actor is authorized
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          ALLOWED_ACTORS: ${{ vars.RELEASE_ADMINS || 'fherbreteau' }}
        run: |
          ACTOR="${TRIGGERING_ACTOR,,}"
          ALLOWED="${ALLOWED_ACTORS,,}"
          for admin in $ALLOWED; do
            if [ "$ACTOR" = "$admin" ]; then
              echo "Actor '$TRIGGERING_ACTOR' is authorized to prepare a release"
              exit 0
            fi
          done
          echo "::error::Actor '$TRIGGERING_ACTOR' is not authorized to prepare a release (allowed: $ALLOWED_ACTORS)"
          exit 1

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          # The release preparation pushes directly to main; the main-branch
          # ruleset only waives its pull-request requirement for the
          # repository-admin role, so authenticate as the RELEASE_TOKEN
          # identity (GITHUB_TOKEN itself stays subject to the rule).
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Validate version input
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          if [ "$HAS_RELEASE_TOKEN" != "true" ]; then
            echo "::error::The RELEASE_TOKEN secret is not configured. Create a fine-grained personal access token with Contents read/write on this repository and store it as the RELEASE_TOKEN secret; the main-branch ruleset waives its pull-request requirement only for the repository-admin role this token authenticates as."
            exit 1
          fi
          VERSION="${INPUT_VERSION}"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION': expected X.Y.Z or X.Y.Z-rcN"
            exit 1
          fi
          if [[ "$VERSION" =~ -rc[0-9]+$ ]]; then
            echo "isFinal=false" >> "$GITHUB_OUTPUT"
            # Pre-release development versions anticipate the associated final
            # version: X.Y.Z-rcN -> pom X.Y.0-SNAPSHOT, Cargo X.Y.0.
            BASE="${VERSION%-rc*}"
            echo "nextVersion=$BASE-SNAPSHOT" >> "$GITHUB_OUTPUT"
            echo "cargoVersion=$BASE" >> "$GITHUB_OUTPUT"
          else
            echo "isFinal=true" >> "$GITHUB_OUTPUT"
            IFS='.' read -r major minor patch <<< "$VERSION"
            echo "nextVersion=$major.$((minor + 1)).0-SNAPSHOT" >> "$GITHUB_OUTPUT"
            echo "cargoVersion=$major.$((minor + 1)).0" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG.md
        run: |
          ARGS=("${{ steps.meta.outputs.version }}")
          if [ "${{ steps.meta.outputs.isFinal }}" = "true" ]; then
            ARGS+=(--final)
          fi
          python3 .github/scripts/prepare_changelog.py "${ARGS[@]}"

      - name: Point the site Maven snippet at the release version
        # The site's installation page should always advertise the latest
        # final version; pre-releases keep pointing consumers at the last
        # final release.
        if: steps.meta.outputs.isFinal == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          SITE="site/docs/installation.md"
          perl -0pi -e 's|(<artifactId>vodozemac-java</artifactId>\s*<version>)[^<]*(</version>)|${1}'"$VERSION"'${2}|' "$SITE"
          if ! grep -q "<version>$VERSION</version>" "$SITE"; then
            echo "::error::Failed to update the Maven snippet in $SITE"
            exit 1
          fi
          echo "The site Maven snippet now points at $VERSION"

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Ensure project versions match the release version
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          POM_CURRENT=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$POM_CURRENT" != "$VERSION" ]; then
            mvn versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
            echo "pom.xml updated: $POM_CURRENT -> $VERSION"
          else
            echo "pom.xml already at $VERSION"
          fi
          CARGO_CURRENT=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -n1)
          if [ "$CARGO_CURRENT" != "$VERSION" ]; then
            sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" rust/Cargo.toml
            rm rust/Cargo.toml.bak
            cargo update --manifest-path rust/Cargo.toml --package vodozemac-java --precise "$VERSION"
            echo "rust/Cargo.toml updated: $CARGO_CURRENT -> $VERSION"
          else
            echo "rust/Cargo.toml already at $VERSION"
          fi

      - name: Commit release preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md site/docs/installation.md pom.xml rust/Cargo.toml rust/Cargo.lock
          git commit -m "chore(release): Prepare ${{ steps.meta.outputs.tag }}"
          git push origin main

      - name: Create and push the release tag
        run: |
          git tag -a "${{ steps.meta.outputs.tag }}" -m "Release ${{ steps.meta.outputs.version }}"
          git push origin "${{ steps.meta.outputs.tag }}"

      - name: Bump to next development version
        # The tag-triggered Release workflow builds from the immutable tag, so
        # main can move on to the next development version right away. This
        # mutation lives here (not in the Release workflow) because this
        # workflow already owns the main-branch writes through the
        # RELEASE_TOKEN identity.
        # - final release X.Y.Z      -> pom X.(Y+1).0-SNAPSHOT, Cargo X.(Y+1).0
        # - pre-release X.Y.Z-rcN    -> pom X.Y.0-SNAPSHOT,      Cargo X.Y.0
        env:
          NEXT_VERSION: ${{ steps.meta.outputs.nextVersion }}
          CARGO_VERSION: ${{ steps.meta.outputs.cargoVersion }}
        run: |
          mvn versions:set -DnewVersion="$NEXT_VERSION" -DgenerateBackupPoms=false
          sed -i.bak "s/^version = \".*\"/version = \"$CARGO_VERSION\"/" rust/Cargo.toml
          rm rust/Cargo.toml.bak
          cargo update --manifest-path rust/Cargo.toml --package vodozemac-java --precise "$CARGO_VERSION"
          git add pom.xml rust/Cargo.toml rust/Cargo.lock
          git commit -m "chore(release): Prepare next development version (pom: $NEXT_VERSION, rust: $CARGO_VERSION)"
          git push origin main
