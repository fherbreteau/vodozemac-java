name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.0.0)'
        required: true
        type: string

env:
  JAVA_VERSION: "25"

concurrency:
  # Safety net against two runs racing on the same release (double tag push
  # or a manual dispatch): the loser is cancelled instead of failing with a
  # 409 Conflict on the package deployments.
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-native:
    # Reuses the same job as build.yml (extract into a reusable workflow).
    # build.yml's Sonar job is skipped for workflow_call (release) runs - the
    # release tag is not a Sonar analysis target (main and PRs are) - so no
    # secrets need to cross the workflow boundary.
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  publish:
    name: Publish to GitHub Packages
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          # Read-only checkout of the immutable tag: this workflow never
          # mutates files (the next-development-version bump belongs to the
          # Prepare Release workflow), so the default GITHUB_TOKEN suffices.
          persist-credentials: false

      - name: Setup Java
        # No server entries here: the next step overwrites ~/.m2/settings.xml
        # with both the 'github' and 'ossrh' entries. Only the GPG key import
        # (used to sign the Maven Central artifacts) comes from setup-java.
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
          gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Write Maven server credentials
        # setup-java can only write one server entry per invocation, but the
        # release deploys to two authenticated repositories: GitHub Packages
        # (server id: github) and Maven Central (server id: ossrh). Write
        # both explicitly; env placeholders are resolved by Maven.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>ossrh</id>
                <username>${env.MAVEN_USERNAME}</username>
                <password>${env.MAVEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          XML

      - name: Download all native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: native-lib-*
          path: downloaded-natives
          merge-multiple: false

      - name: Organize native libraries
        run: |
          mkdir -p src/main/resources/native/{linux-x86_64,linux-aarch64,darwin-x86_64,darwin-aarch64,windows-x86_64,windows-aarch64}
          cp downloaded-natives/native-lib-linux-x86_64/*.so src/main/resources/native/linux-x86_64/
          cp downloaded-natives/native-lib-linux-aarch64/*.so src/main/resources/native/linux-aarch64/
          cp downloaded-natives/native-lib-darwin-x86_64/*.dylib src/main/resources/native/darwin-x86_64/
          cp downloaded-natives/native-lib-darwin-aarch64/*.dylib src/main/resources/native/darwin-aarch64/
          cp downloaded-natives/native-lib-windows-x86_64/*.dll src/main/resources/native/windows-x86_64/
          cp downloaded-natives/native-lib-windows-aarch64/*.dll src/main/resources/native/windows-aarch64/

      - name: Determine whether the release is final
        # The tagged commit already carries the release version (set by the
        # Prepare Release workflow) and the next-development-version bump is
        # also its responsibility - this workflow only publishes.
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "isFinal=true" >> "$GITHUB_OUTPUT"
          else
            echo "isFinal=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Packages
        run: >-
          mvn clean deploy -DskipRustBuild=true -DskipTests
          -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/fherbreteau/vodozemac-java
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Maven Central
        run: mvn deploy -Prelease -DskipRustBuild=true -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Final release: base the notes on the previous final published release
            PREV_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json tagName,isDraft,isPrerelease \
              --jq '[.[] | select(.isDraft == false and .isPrerelease == false)] | sort_by(.createdAt) | reverse | .[0].tagName // empty')
          else
            # Pre-release: base the notes on the previous published release
            PREV_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json tagName,isDraft \
              --jq '[.[] | select(.isDraft == false)] | sort_by(.createdAt) | reverse | .[0].tagName // empty')
          fi
          ARGS=(-f tag_name="$TAG")
          if [ -n "$PREV_TAG" ]; then
            ARGS+=(-f previous_tag_name="$PREV_TAG")
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${ARGS[@]}" \
            --jq '.body' > release-notes.md

      - name: Create GitHub Release
        # Immutable releases only allow asset uploads while a release is a
        # draft: create the release as a draft, upload the jars, then publish
        # it in the next step (publishing locks the assets immutably).
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: target/*.jar
          body_path: release-notes.md
          draft: true
          prerelease: ${{ steps.meta.outputs.isFinal == 'false' }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ inputs.tag || github.ref_name }}" --draft=false

