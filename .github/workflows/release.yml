name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0 or 1.0.0-rc1)'
        required: true
        type: string

env:
  JAVA_VERSION: "25"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ============================================
  # JOB 1: Prepare the release (changelog, versions, tag)
  # ============================================
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      isFinal: ${{ steps.meta.outputs.isFinal }}
      nextVersion: ${{ steps.meta.outputs.nextVersion }}
      cargoVersion: ${{ steps.meta.outputs.cargoVersion }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version input
        id: meta
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION': expected X.Y.Z or X.Y.Z-rcN"
            exit 1
          fi
          if [[ "$VERSION" =~ -rc[0-9]+$ ]]; then
            echo "isFinal=false" >> "$GITHUB_OUTPUT"
          else
            echo "isFinal=true" >> "$GITHUB_OUTPUT"
            IFS='.' read -r major minor patch <<< "$VERSION"
            echo "nextVersion=$major.$((minor + 1)).0-SNAPSHOT" >> "$GITHUB_OUTPUT"
            echo "cargoVersion=$major.$((minor + 1)).0" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG.md
        run: |
          ARGS=("${{ steps.meta.outputs.version }}")
          if [ "${{ steps.meta.outputs.isFinal }}" = "true" ]; then
            ARGS+=(--final)
          fi
          python3 .github/scripts/prepare_changelog.py "${ARGS[@]}"

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Ensure project versions match the release version
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          POM_CURRENT=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$POM_CURRENT" != "$VERSION" ]; then
            mvn versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
            echo "pom.xml updated: $POM_CURRENT -> $VERSION"
          else
            echo "pom.xml already at $VERSION"
          fi
          CARGO_CURRENT=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -n1)
          if [ "$CARGO_CURRENT" != "$VERSION" ]; then
            sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" rust/Cargo.toml
            rm rust/Cargo.toml.bak
            cargo update --manifest-path rust/Cargo.toml --package vodozemac-java --precise "$VERSION"
            echo "rust/Cargo.toml updated: $CARGO_CURRENT -> $VERSION"
          else
            echo "rust/Cargo.toml already at $VERSION"
          fi

      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md pom.xml rust/Cargo.toml rust/Cargo.lock
          git commit -m "chore(release): Prepare ${{ steps.meta.outputs.tag }}"
          git push origin main
          git tag -a "${{ steps.meta.outputs.tag }}" -m "Release ${{ steps.meta.outputs.version }}"
          git push origin "${{ steps.meta.outputs.tag }}"

  # ============================================
  # JOB 2: Build Rust native libraries (from the release tag)
  # ============================================
  build-native:
    name: Build native libraries
    needs: prepare-release
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare-release.outputs.tag }}

  # ============================================
  # JOB 3: Publish artifacts and create the GitHub Release
  # ============================================
  publish:
    name: Publish to GitHub Packages and Maven Central
    needs: [prepare-release, build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Download all native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: native-lib-*
          path: downloaded-natives
          merge-multiple: false

      - name: Organize native libraries
        run: |
          mkdir -p src/main/resources/native/{linux-x86_64,linux-aarch64,darwin-x86_64,darwin-aarch64,windows-x86_64,windows-aarch64}
          cp downloaded-natives/native-lib-linux-x86_64/*.so src/main/resources/native/linux-x86_64/
          cp downloaded-natives/native-lib-linux-aarch64/*.so src/main/resources/native/linux-aarch64/
          cp downloaded-natives/native-lib-darwin-x86_64/*.dylib src/main/resources/native/darwin-x86_64/
          cp downloaded-natives/native-lib-darwin-aarch64/*.dylib src/main/resources/native/darwin-aarch64/
          cp downloaded-natives/native-lib-windows-x86_64/*.dll src/main/resources/native/windows-x86_64/
          cp downloaded-natives/native-lib-windows-aarch64/*.dll src/main/resources/native/windows-aarch64/

      - name: Publish to GitHub Packages
        run: >-
          mvn clean deploy -DskipRustBuild=true -DskipTests
          -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/fherbreteau/vodozemac-java
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Maven Central
        run: mvn deploy -Prelease -DskipRustBuild=true -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          if [ "${{ needs.prepare-release.outputs.isFinal }}" = "true" ]; then
            # Final release: base the notes on the previous final published release
            PREV_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json tagName,isDraft,isPrerelease \
              --jq '[.[] | select(.isDraft == false and .isPrerelease == false)] | sort_by(.createdAt) | reverse | .[0].tagName // empty')
          else
            # Pre-release: base the notes on the previous published release
            PREV_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json tagName,isDraft \
              --jq '[.[] | select(.isDraft == false)] | sort_by(.createdAt) | reverse | .[0].tagName // empty')
          fi
          ARGS=(-f tag_name="$TAG")
          if [ -n "$PREV_TAG" ]; then
            ARGS+=(-f previous_tag_name="$PREV_TAG")
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${ARGS[@]}" \
            --jq '.body' > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: target/*.jar
          body_path: release-notes.md
          prerelease: ${{ needs.prepare-release.outputs.isFinal == 'false' }}

      - name: Bump to next development version
        if: needs.prepare-release.outputs.isFinal == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mvn versions:set -DnewVersion=${{ needs.prepare-release.outputs.nextVersion }} -DgenerateBackupPoms=false
          sed -i.bak 's/^version = ".*"/version = "'"${CARGO_VERSION}"'"/' rust/Cargo.toml
          rm rust/Cargo.toml.bak
          cargo update --manifest-path rust/Cargo.toml --package vodozemac-java --precise "${CARGO_VERSION}"
          git add pom.xml rust/Cargo.toml rust/Cargo.lock
          git commit -m "chore(release): Prepare next development version (pom: $NEXT_VERSION, rust: $CARGO_VERSION)"
          git push origin HEAD:main
        env:
          NEXT_VERSION: ${{ needs.prepare-release.outputs.nextVersion }}
          CARGO_VERSION: ${{ needs.prepare-release.outputs.cargoVersion }}
