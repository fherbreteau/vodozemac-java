name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  JAVA_VERSION: "25"

jobs:
  build-native:
    # Reuses the same job as build.yml (extract into a reusable workflow)
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish to GitHub Packages
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Download all native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: native-lib-*
          path: downloaded-natives
          merge-multiple: false

      - name: Organize native libraries
        run: |
          mkdir -p src/main/resources/native/{linux-x86_64,linux-aarch64,darwin-x86_64,darwin-aarch64,windows-x86_64,windows-aarch64}
          cp downloaded-natives/native-lib-linux-x86_64/*.so src/main/resources/native/linux-x86_64/
          cp downloaded-natives/native-lib-linux-aarch64/*.so src/main/resources/native/linux-aarch64/
          cp downloaded-natives/native-lib-darwin-x86_64/*.dylib src/main/resources/native/darwin-x86_64/
          cp downloaded-natives/native-lib-darwin-aarch64/*.dylib src/main/resources/native/darwin-aarch64/
          cp downloaded-natives/native-lib-windows-x86_64/*.dll src/main/resources/native/windows-x86_64/
          cp downloaded-natives/native-lib-windows-aarch64/*.dll src/main/resources/native/windows-aarch64/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Determine next development version
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "isFinal=true" >> "$GITHUB_OUTPUT"
            IFS='.' read -r major minor patch <<< "${TAG#v}"
            echo "nextVersion=$major.$((minor + 1)).0-SNAPSHOT" >> "$GITHUB_OUTPUT"
          else
            echo "isFinal=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update pom.xml version
        run: mvn versions:set -DnewVersion=${{ steps.version.outputs.VERSION }}

      - name: Publish to GitHub Packages
        run: >-
          mvn clean deploy -DskipRustBuild=true -DskipTests
          -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/fherbreteau/vodozemac-java
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Maven Central
        run: >-
          mvn deploy -Prelease -DskipRustBuild=true -DskipTests
          -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE"
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          files: target/*.jar
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.isFinal == 'false' }}

      - name: Bump pom to next development version
        if: steps.meta.outputs.isFinal == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mvn versions:set -DnewVersion=${{ steps.meta.outputs.nextVersion }} -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "chore(release): Prepare next development version ($NEXT_VERSION)"
          git push origin HEAD:main
        env:
          NEXT_VERSION: ${{ steps.meta.outputs.nextVersion }}