name: GitHub Pages

on:
  workflow_run:
    # Redeploy after every successful Release run so the site's
    # /apidocs/latest/ serves the fresh release's Javadoc.
    workflows: ["Release"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run fires on any conclusion: only redeploy after a successful
    # release (site pushes and manual dispatches are unconditional).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Build and deploy the user guide
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install MkDocs Material
        run: pip install -r site/requirements.txt

      - name: Build the site
        working-directory: site
        # --strict fails the build on broken internal links
        run: mkdocs build --strict

      - name: Fetch the latest released Javadoc
        # The site self-hosts the Javadoc of the latest Maven Central release
        # under /apidocs/latest/ (javadoc.io proved unreliable: it generated
        # only 1 of the 4 releases and offers no API to force generation).
        run: |
          VERSION=$(curl -fsSL \
            https://repo1.maven.org/maven2/io/github/fherbreteau/vodozemac-java/maven-metadata.xml \
            | grep -o '<latest>[^<]*</latest>' | sed 's/<[^>]*>//g')
          echo "Latest released version: $VERSION"
          curl -fsSL -o javadoc.jar \
            "https://repo1.maven.org/maven2/io/github/fherbreteau/vodozemac-java/$VERSION/vodozemac-java-$VERSION-javadoc.jar"
          mkdir -p site/site/apidocs/latest
          unzip -q -o javadoc.jar -d site/site/apidocs/latest
          rm javadoc.jar
          echo "Javadoc $VERSION deployed under /apidocs/latest/"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
