name: Build Multi-Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (defaults to the triggering commit)'
        required: false
        type: string
    secrets:
      SONAR_TOKEN:
        description: 'SonarCloud token for the quality gate analysis'
        required: false

env:
  RUST_VERSION: "1.99.1"
  JAVA_VERSION: "25"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # JOB 1: Build Rust native libraries
  # ============================================
  build-native:
    name: Build native - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib_name: libvodozemac_java.so
            artifact_path: rust/target/x86_64-unknown-linux-gnu/release/libvodozemac_java.so

          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            lib_name: libvodozemac_java.so
            artifact_path: rust/target/aarch64-unknown-linux-gnu/release/libvodozemac_java.so

          - name: darwin-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            lib_name: libvodozemac_java.dylib
            artifact_path: rust/target/x86_64-apple-darwin/release/libvodozemac_java.dylib

          - name: darwin-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            lib_name: libvodozemac_java.dylib
            artifact_path: rust/target/aarch64-apple-darwin/release/libvodozemac_java.dylib

          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            lib_name: vodozemac_java.dll
            artifact_path: rust/target/x86_64-pc-windows-msvc/release/vodozemac_java.dll

          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            lib_name: vodozemac_java.dll
            artifact_path: rust/target/aarch64-pc-windows-msvc/release/vodozemac_java.dll

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      - name: Build Rust library
        working-directory: rust
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Verify artifact exists
        shell: bash
        run: |
          if [ ! -f "${{ matrix.artifact_path }}" ]; then
            echo "❌ Artifact not found: ${{ matrix.artifact_path }}"
            exit 1
          fi
          echo "✅ Artifact found"
          ls -la "${{ matrix.artifact_path }}"

      - name: Upload native library artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-lib-${{ matrix.name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 7

  # ============================================
  # JOB 2: Assemble the complete Maven package
  # ============================================
  package-maven:
    name: Package Maven with all natives
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      # Download all native artifacts generated previously
      - name: Download all native libraries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-lib-*
          path: downloaded-natives
          merge-multiple: false

      - name: Organize native libraries in resources
        run: |
          mkdir -p src/main/resources/native/linux-x86_64
          mkdir -p src/main/resources/native/linux-aarch64
          mkdir -p src/main/resources/native/darwin-x86_64
          mkdir -p src/main/resources/native/darwin-aarch64
          mkdir -p src/main/resources/native/windows-x86_64
          mkdir -p src/main/resources/native/windows-aarch64

          cp downloaded-natives/native-lib-linux-x86_64/*.so src/main/resources/native/linux-x86_64/
          cp downloaded-natives/native-lib-linux-aarch64/*.so src/main/resources/native/linux-aarch64/
          cp downloaded-natives/native-lib-darwin-x86_64/*.dylib src/main/resources/native/darwin-x86_64/
          cp downloaded-natives/native-lib-darwin-aarch64/*.dylib src/main/resources/native/darwin-aarch64/
          cp downloaded-natives/native-lib-windows-x86_64/*.dll src/main/resources/native/windows-x86_64/
          cp downloaded-natives/native-lib-windows-aarch64/*.dll src/main/resources/native/windows-aarch64/

          echo "📦 Native libraries organized:"
          find src/main/resources/native -type f

      - name: Build with Maven (skip Rust compilation)
        run: mvn clean package -DskipRustBuild=true -DskipTests

      - name: Smoke test fat JAR
        shell: bash
        run: |
          cat > /tmp/SmokeTest.java <<'EOF'
          import io.github.fherbreteau.vodozemac.Vodozemac;

          public class SmokeTest {
              public static void main(String[] args) {
                  String encoded = Vodozemac.base64Encode("smoke".getBytes());
                  if (!"c21va2U".equals(encoded)) {
                      throw new AssertionError("Unexpected base64 output: " + encoded);
                  }
                  byte[] decoded = Vodozemac.base64Decode(encoded);
                  if (!"smoke".equals(new String(decoded))) {
                      throw new AssertionError("Unexpected base64 input: " + new String(decoded));
                  }
                  System.out.println("Fat JAR smoke test passed");
              }
          }
          EOF
          jars=(target/vodozemac-java-*.jar)
          if [ "${#jars[@]}" -ne 1 ] || [ ! -f "${jars[0]}" ]; then
            echo "::error::Expected exactly one vodozemac-java JAR, found ${#jars[@]}"
            exit 1
          fi
          jar="${jars[0]}"
          echo "Testing JAR: $jar"
          java --enable-native-access=ALL-UNNAMED -cp "$jar" /tmp/SmokeTest.java

      - name: Upload Maven artifact (JAR complet)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vodozemac-java-jar
          path: target/*.jar
          retention-days: 30

  # ============================================
  # JOB 3: Tests on each platform
  # ============================================
  test:
    name: Test - ${{ matrix.name }}
    needs: build-native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            native_artifact: native-lib-linux-x86_64
            distribution: 'temurin'

          - name: linux-aarch64
            os: ubuntu-24.04-arm
            native_artifact: native-lib-linux-aarch64
            distribution: 'temurin'

          - name: darwin-x86_64
            os: macos-15-intel
            native_artifact: native-lib-darwin-x86_64
            distribution: 'temurin'

          - name: darwin-aarch64
            os: macos-latest
            native_artifact: native-lib-darwin-aarch64
            distribution: 'temurin'

          - name: windows-x86_64
            os: windows-latest
            native_artifact: native-lib-windows-x86_64
            distribution: 'temurin'

          - name: windows-aarch64
            os: windows-11-arm
            native_artifact: native-lib-windows-aarch64
            distribution: 'microsoft'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{matrix.distribution}}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Download native library for this platform
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.native_artifact }}
          path: target/classes

      - name: Run tests
        run: mvn test -DskipRustBuild=true
        shell: bash

  # ============================================
  # JOB 4: Sonar code Analysis
  # ============================================
  quality:
    if: ${{ github.repository == 'fherbreteau/vodozemac-java' }}
    name: Sonar code analysis
    needs: [package-maven, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Run tests
        run: mvn verify
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov

      - name: Rust coverage
        working-directory: rust
        run: |
          cargo llvm-cov --lcov --output-path ../target/rust-lcov.info
          # SonarCloud matches lcov SF: paths against files relative to the
          # project base dir: rewrite the absolute rust/ paths so the Rust
          # coverage is actually imported instead of being counted at 0%.
          sed -i.bak "s|SF:${GITHUB_WORKSPACE}/rust/|SF:rust/|" ../target/rust-lcov.info
          rm ../target/rust-lcov.info.bak

      - name: Sonar check with Maven
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
