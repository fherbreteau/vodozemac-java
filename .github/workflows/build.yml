name: Build Multi-Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  RUST_VERSION: "1.88.0"
  JAVA_VERSION: "25"

jobs:
  # ============================================
  # JOB 1: Build des librairies natives Rust
  # ============================================
  build-native:
    name: Build native - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib_name: libvodozemac_java.so
            artifact_path: rust/target/x86_64-unknown-linux-gnu/release/libvodozemac_java.so

          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            lib_name: libvodozemac_java.so
            artifact_path: rust/target/aarch64-unknown-linux-gnu/release/libvodozemac_java.so

#          - name: darwin-x86_64
#            os: macos-14-intel
#            target: x86_64-apple-darwin
#            lib_name: libvodozemac_java.dylib
#            artifact_path: rust/target/x86_64-apple-darwin/release/libvodozemac_java.dylib

          - name: darwin-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            lib_name: libvodozemac_java.dylib
            artifact_path: rust/target/aarch64-apple-darwin/release/libvodozemac_java.dylib

          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            lib_name: vodozemac_java.dll
            artifact_path: rust/target/x86_64-pc-windows-msvc/release/vodozemac_java.dll

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java (pour générer les headers JNI)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      - name: Verify JAVA_HOME is set
        run: echo "JAVA_HOME=$JAVA_HOME"
        shell: bash

      - name: Build Rust library
        working-directory: rust
        run: cargo build --locked --release --target ${{ matrix.target }}
        env:
          # JNI a besoin de JAVA_HOME pour trouver jni.h
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Verify artifact exists
        shell: bash
        run: |
          if [ ! -f "${{ matrix.artifact_path }}" ]; then
            echo "❌ Artifact not found: ${{ matrix.artifact_path }}"
            exit 1
          fi
          echo "✅ Artifact found"
          ls -la "${{ matrix.artifact_path }}"

      - name: Upload native library artifact
        uses: actions/upload-artifact@v6
        with:
          name: native-lib-${{ matrix.name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 7

  # ============================================
  # JOB 2: Assemblage du package Maven complet
  # ============================================
  package-maven:
    name: Package Maven with all natives
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      # Télécharge tous les artefacts natifs générés précédemment
      - name: Download all native libraries
        uses: actions/download-artifact@v7
        with:
          pattern: native-lib-*
          path: downloaded-natives
          merge-multiple: false

      - name: Organize native libraries in resources
        run: |
          mkdir -p src/main/resources/native/linux-x86_64
          mkdir -p src/main/resources/native/linux-aarch64
          # mkdir -p src/main/resources/native/darwin-x86_64
          mkdir -p src/main/resources/native/darwin-aarch64
          mkdir -p src/main/resources/native/windows-x86_64

          cp downloaded-natives/native-lib-linux-x86_64/*.so src/main/resources/native/linux-x86_64/
          cp downloaded-natives/native-lib-linux-aarch64/*.so src/main/resources/native/linux-aarch64/
          # cp downloaded-natives/native-lib-darwin-x86_64/*.dylib src/main/resources/native/darwin-x86_64/
          cp downloaded-natives/native-lib-darwin-aarch64/*.dylib src/main/resources/native/darwin-aarch64/
          cp downloaded-natives/native-lib-windows-x86_64/*.dll src/main/resources/native/windows-x86_64/

          echo "📦 Native libraries organized:"
          find src/main/resources/native -type f

      - name: Build with Maven (skip Rust compilation)
        run: mvn clean package -DskipRustBuild=true -DskipTests

      - name: Upload Maven artifact (JAR complet)
        uses: actions/upload-artifact@v6
        with:
          name: vodozemac-java-jar
          path: target/*.jar
          retention-days: 30

  # ============================================
  # JOB 3: Tests sur chaque plateforme
  # ============================================
  test:
    name: Test - ${{ matrix.name }}
    needs: build-native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            native_artifact: native-lib-linux-x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            native_artifact: native-lib-linux-aarch64
#          - name: darwin-x86_64
#            os: macos-14-intel
#            native_artifact: native-lib-darwin-x86_64
          - name: darwin-aarch64
            os: macos-latest
            native_artifact: native-lib-darwin-aarch64
          - name: windows-x86_64
            os: windows-latest
            native_artifact: native-lib-windows-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Download native library for this platform
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.native_artifact }}
          path: target/classes

      - name: Run tests
        run: mvn test -DskipRustBuild=true
        shell: bash

  # ============================================
  # JOB 4: Sonar code Analysis
  # ============================================
  quality:
    if: ${{ github.repository == 'fherbreteau/vodozemac-java' }}
    name: Sonar code analysis
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Run tests
        run: mvn verify
        shell: bash

      - name: Sonar check with Maven
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
