name: Quick Tests (PR)

on:
  pull_request:
    branches: [main]

env:
  RUST_VERSION: "1.88.0"
  JAVA_VERSION: "25"

jobs:
  quick-test:
    name: Quick test - Linux only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7 # v7

      - uses: actions/setup-java@v5 # v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v7
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt, llvm-tools-preview

      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust

      - name: Compile Java classes (for Rust JNI tests)
        run: mvn compile -DskipTests

      - name: Rust tests
        working-directory: rust
        run: cargo test

      - name: Rust coverage
        working-directory: rust
        run: |
          mkdir -p ../target/coverage
          cargo llvm-cov --cobertura --output-path ../target/coverage/rust-coverage.xml

      - name: Rust clippy
        working-directory: rust
        run: cargo clippy -- -D warnings

      - name: Rust format check
        working-directory: rust
        run: cargo fmt -- --check

      - name: Build and test Java
        run: mvn verify

      - name: Generate coverage report
        run: python3 .github/scripts/coverage-report.py

      - name: Post coverage comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3
        with:
          recreate: true
          path: coverage-report.md
