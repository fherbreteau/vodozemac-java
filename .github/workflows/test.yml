name: Quick Tests (PR)

on:
  pull_request:
    branches: [main]

jobs:
  quick-test:
    name: Quick test - Linux only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Compile Java classes (for Rust JNI tests)
        run: mvn compile -DskipTests -DskipRustBuild=true

      - name: Rust tests
        working-directory: rust
        run: cargo test

      - name: Rust coverage
        working-directory: rust
        run: |
          mkdir -p ../target/coverage
          cargo llvm-cov --cobertura --output-path ../target/coverage/rust-coverage.xml

      - name: Rust clippy
        working-directory: rust
        run: cargo clippy -- -D warnings

      - name: Rust format check
        working-directory: rust
        run: cargo fmt -- --check

      - name: Build and test Java
        run: mvn verify

      - name: Generate coverage report
        run: python3 .github/scripts/coverage-report.py

      - name: Post coverage comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          recreate: true
          path: coverage-report.md
