name: Quick Tests (PR)

on:
  pull_request:
    branches: [main]

env:
  RUST_VERSION: "1.88.0"
  JAVA_VERSION: "25"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-test:
    name: Quick test - Linux only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v7
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt, llvm-tools-preview

      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust

      - name: Compile Java classes (for Rust JNI tests)
        run: mvn compile -DskipTests

      - name: Rust tests
        working-directory: rust
        run: cargo test

      - name: Rust coverage
        working-directory: rust
        run: |
          mkdir -p ../target/coverage
          cargo llvm-cov --cobertura --output-path ../target/coverage/rust-coverage.xml

      - name: Rust clippy
        working-directory: rust
        run: cargo clippy -- -D warnings

      - name: Rust format check
        working-directory: rust
        run: cargo fmt -- --check

      - name: Rust security audit
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        working-directory: rust
        run: cargo audit

      - name: Build and test Java
        run: mvn verify

      - name: Generate coverage report
        run: python3 .github/scripts/coverage-report.py

      - name: Publish coverage summary
        if: always() && hashFiles('coverage-report.md') != ''
        run: cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"
