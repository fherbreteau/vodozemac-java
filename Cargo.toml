[package]
name = "vodozemac-java"
version = "0.1.0"
authors = ["François Herbreteau <francois.herbreteau@gmail.com>"]
edition = "2024"

[dependencies]
jni = "0.21.1"
vodozemac = { version = "0.9.0", features = ["insecure-pk-encryption", "low-level-api"] }
getrandom = {  version = "0.2.16", features = [ "custom" ] }
parking_lot = "0.12.4"
macros = { path = "./macros" }
zeroize = "1.8.1"
serde_json = "1.0.141"
serde = "1.0.219"

[lib]
name = "vodozemac"
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1
