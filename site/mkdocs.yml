site_name: Vodozemac Java
site_description: Java bindings for the Vodozemac Matrix cryptography library
site_url: https://fherbreteau.github.io/vodozemac-java/
repo_url: https://github.com/fherbreteau/vodozemac-java
repo_name: fherbreteau/vodozemac-java
copyright: Copyright &copy; 2025-2026 François HERBRETEAU — Apache 2.0

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fherbreteau/vodozemac-java
    - icon: fontawesome/solid/box-open
      link: https://central.sonatype.com/artifact/io.github.fherbreteau/vodozemac-java

nav:
  - Home: index.md
  - Installation: installation.md
  - User guide:
      - Getting started: guide/getting-started.md
      - Resource management: guide/resource-management.md
      - Thread safety: guide/thread-safety.md
      - Key material handling: guide/key-material.md
  - Samples:
      - Olm sessions: samples/olm.md
      - Megolm group sessions: samples/megolm.md
      - SAS verification: samples/sas.md
      - ECIES channels: samples/ecies.md
      - PK encryption (backup): samples/backup.md
      - Cross-signing keys: samples/cross-signing.md
  - API reference: api.md
  - Migration from jOlm: migration.md
  - Security: security.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
